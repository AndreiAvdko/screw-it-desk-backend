openapi: 3.0.3
info:
  title: Equipment Service Management API
  description: API для управления заявками по обслуживанию оборудования
  version: 1.0.0
  contact:
    name: Support
    email: support@example.com

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:8080/v1
    description: Development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Общие схемы
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

    # Схемы для заявок
    RequestListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: "725-089"
        objectEquipment:
          type: string
          example: "Сеть АЗС 'Рога и Копыта'"
        description:
          type: string
          example: "Отсутствует связь с контроллером..."
        company:
          type: string
          example: "ООО «ТехноСервис Плюс»"
        stageLabel:
          type: string
          example: "НОВАЯ"
        stageTone:
          type: string
          enum: [new, in_progress, completed, closed, cancelled]
        createdAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        assignee:
          type: string
          example: "Соколов Д. М."
        scheduled:
          type: string
          example: "29.03.2026, 09:00 — 13:00"
        accent:
          type: string
          enum: [orange, red, green, blue]
      
    RequestDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        displayNumber:
          type: string
          example: "149201"
        criticality:
          type: integer
          minimum: 1
          maximum: 5
        requestType:
          type: string
          example: "Инцидент"
        workType:
          type: string
          example: "Аварийное обслуживание"
        objectEquipment:
          type: string
        description:
          type: string
        address:
          type: string
        stage:
          type: string
        stageLabel:
          type: string
        customerCompany:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        performer:
          type: object
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            initials:
              type: string
        paymentRecipientCompany:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        parentRequest:
          type: object
          nullable: true
          properties:
            id:
              type: string
            number:
              type: string
        objectPlan:
          type: string
        contactPerson:
          type: string
        deadline:
          type: string
          format: date-time
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    CreateRequestRequest:
      type: object
      required:
        - objectEquipment
        - description
        - customerCompanyId
      properties:
        objectEquipment:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        criticality:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        requestType:
          type: string
        workType:
          type: string
        address:
          type: string
        customerCompanyId:
          type: string
          format: uuid
        paymentRecipientCompanyId:
          type: string
          format: uuid
        parentRequestId:
          type: string
          format: uuid
        contactPerson:
          type: string
        objectPlan:
          type: string
        deadline:
          type: string
          format: date-time
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
    
    UpdateRequestRequest:
      type: object
      properties:
        objectEquipment:
          type: string
        description:
          type: string
        criticality:
          type: integer
          minimum: 1
          maximum: 5
        requestType:
          type: string
        workType:
          type: string
        address:
          type: string
        stage:
          type: string
          enum: [new, in_progress, completed, closed, cancelled]
        assigneeId:
          type: string
          format: uuid
        paymentRecipientCompanyId:
          type: string
          format: uuid
        contactPerson:
          type: string
        objectPlan:
          type: string
        deadline:
          type: string
          format: date-time
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
    
    FileInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        uploadedAt:
          type: string
          format: date-time
    
    MessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        message:
          type: string
        isInternal:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ListResponse:
      type: object
      properties:
        items:
          type: array
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

security:
  - BearerAuth: []

paths:
  /requests:
    get:
      summary: Получение списка заявок
      description: Доступно для инженеров и администраторов
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: stage
          in: query
          description: Фильтр по статусу
          schema:
            type: string
            enum: [new, in_progress, completed, closed, cancelled]
        - name: assigneeId
          in: query
          description: Фильтр по исполнителю
          schema:
            type: string
            format: uuid
        - name: customerCompanyId
          in: query
          description: Фильтр по компании-заказчику
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: Поиск по номеру, объекту, описанию
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RequestListResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
        '500':
          description: Внутренняя ошибка сервера
    
    post:
      summary: Создание новой заявки
      description: Доступно для всех авторизованных пользователей
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestRequest'
      responses:
        '201':
          description: Заявка успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailResponse'
        '400':
          description: Некорректные данные
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
        '500':
          description: Внутренняя ошибка сервера

  /requests/{id}:
    get:
      summary: Получение детальной информации по заявке
      description: |
        Доступно для:
        - Инженеров и администраторов
        - Пользователя, который создал заявку
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailResponse'
        '404':
          description: Заявка не найдена
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
    
    put:
      summary: Обновление заявки
      description: Доступно для инженеров и администраторов
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestRequest'
      responses:
        '200':
          description: Заявка успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailResponse'
        '400':
          description: Некорректные данные
        '404':
          description: Заявка не найдена
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
    
    delete:
      summary: Удаление заявки
      description: Доступно только для администраторов
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Заявка успешно удалена
        '404':
          description: Заявка не найдена
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен (требуются права администратора)

  /requests/{id}/messages:
    get:
      summary: Получение сообщений заявки
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
    
    post:
      summary: Добавление сообщения к заявке
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                isInternal:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /requests/{id}/files:
    get:
      summary: Получение списка файлов заявки
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
    
    post:
      summary: Загрузка файла к заявке
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'

  /requests/{id}/checklists:
    get:
      summary: Получение чек-листов заявки
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChecklistResponse'

  /requests/{id}/completions:
    get:
      summary: Получение истории выполненных работ
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkCompletionResponse'

  /requests/{id}/history:
    get:
      summary: История изменений заявки
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryRecordResponse'

  /requests/{id}/rating:
    post:
      summary: Оценка выполненной заявки
      description: Доступно для заказчика после завершения работ
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Оценка сохранена