openapi: 3.0.0
info:
  title: Users Service API
  version: 1.0.0
  description: Сервис управления пользователями (гибридный REST API)

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: Users
    description: Управление пользователями
  - name: Profile
    description: Профиль текущего пользователя
  - name: Admin
    description: Административные операции
  - name: Internal
    description: Внутренние эндпоинты

paths:
  # ========== ПУБЛИЧНЫЕ ЭНДПОИНТЫ ==========
  /users/register:
    post:
      summary: Регистрация нового пользователя
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, role]
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3, maxLength: 100 }
                password: { type: string, minLength: 8 }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                phone: { type: string, pattern: "^\\+?[1-9][0-9]{7,14}$" }
                role: 
                  type: string
                  enum: [customer, contractor]
                  description: "Заказчик или Исполнитель. Администраторы создаются только через админ-панель"
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  # ========== REST ЭНДПОИНТЫ ДЛЯ ПОЛЬЗОВАТЕЛЕЙ ==========
  /users:
    get:
      summary: Получение списка пользователей с фильтрацией по роли
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: 
            type: string
            enum: [createdAt:asc, createdAt:desc, email:asc, email:desc]
            default: "createdAt:desc"
        - name: role
          in: query
          schema: 
            type: string
            enum: [admin, customer, contractor, all]
            default: all
          description: "Фильтр по роли. admin - администраторы, customer - заказчики, contractor - исполнители"
        - name: status
          in: query
          schema: 
            type: string
            enum: [active, inactive, blocked, pending, all]
            default: all
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Поиск по email, username, firstName, lastName
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      summary: Создание пользователя (админ)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, role]
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3, maxLength: 100 }
                password: { type: string, minLength: 8 }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                phone: { type: string }
                role: 
                  type: string
                  enum: [admin, customer, contractor]
                  description: "admin - администратор, customer - заказчик, contractor - исполнитель"
                status: { type: string, enum: [active, inactive, blocked], default: active }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    get:
      summary: Получение пользователя по ID
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      summary: Частичное обновление пользователя
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3, maxLength: 100 }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                phone: { type: string }
                role: { type: string, enum: [admin, customer, contractor] }
                status: { type: string, enum: [active, inactive, blocked] }
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      summary: Мягкое удаление пользователя
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Пользователь удален }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ========== СПЕЦИАЛЬНЫЕ ЭНДПОИНТЫ ДЛЯ ПАГИНАЦИИ ПО РОЛЯМ ==========
  /users/admins:
    get:
      summary: Получение списка администраторов с пагинацией
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: 
            type: string
            enum: [createdAt:asc, createdAt:desc, email:asc, email:desc]
            default: "createdAt:desc"
        - name: status
          in: query
          schema: 
            type: string
            enum: [active, inactive, blocked, pending, all]
            default: all
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Поиск по email, username, firstName, lastName
      responses:
        '200':
          description: Список администраторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/customers:
    get:
      summary: Получение списка заказчиков с пагинацией
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: 
            type: string
            enum: [createdAt:asc, createdAt:desc, email:asc, email:desc]
            default: "createdAt:desc"
        - name: status
          in: query
          schema: 
            type: string
            enum: [active, inactive, blocked, pending, all]
            default: all
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Поиск по email, username, firstName, lastName
      responses:
        '200':
          description: Список заказчиков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/contractors:
    get:
      summary: Получение списка исполнителей с пагинацией
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: 
            type: string
            enum: [createdAt:asc, createdAt:desc, email:asc, email:desc]
            default: "createdAt:desc"
        - name: status
          in: query
          schema: 
            type: string
            enum: [active, inactive, blocked, pending, all]
            default: all
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Поиск по email, username, firstName, lastName
      responses:
        '200':
          description: Список исполнителей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ========== ПРОФИЛЬ ТЕКУЩЕГО ПОЛЬЗОВАТЕЛЯ ==========
  /profile:
    get:
      summary: Получение своего профиля
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    patch:
      summary: Обновление своего профиля
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3, maxLength: 100 }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                phone: { type: string }
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ========== СПЕЦИАЛЬНЫЕ ЭНДПОИНТЫ ==========
  /profile/change-password:
    post:
      summary: Смена пароля
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '204': { description: Пароль изменен }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/verify-email:
    post:
      summary: Подтверждение email
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Email подтвержден
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Email verified" }
        '400': { $ref: '#/components/responses/BadRequest' }

  /profile/resend-verification:
    post:
      summary: Повторная отправка письма подтверждения
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      responses:
        '202':
          description: Письмо отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Verification email sent" }

  /users/{id}/restore:
    post:
      summary: Восстановление удаленного пользователя
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Пользователь восстановлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  # ========== ВНУТРЕННИЕ ЭНДПОИНТЫ ДЛЯ AUTH SERVICE ==========
  /internal/users/by-email/{email}:
    get:
      summary: Получение пользователя по email (для Auth Service)
      tags: [Internal]
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUserData'
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/users/by-id/{id}:
    get:
      summary: Получение базовой информации пользователя (для Auth Service)
      tags: [Internal]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Базовая информация
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string }
                  role: { type: string }
                  status: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      summary: Проверка здоровья сервиса
      tags: [System]
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string, example: "1.0.0" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен от Auth Service

  responses:
    BadRequest:
      description: Невалидные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Неавторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт (уже существует)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: 
          type: string
          enum: [admin, customer, contractor]
          description: "admin - администратор, customer - заказчик, contractor - исполнитель"
        status: { type: string, enum: [active, inactive, blocked, pending] }
        rating: { type: number, minimum: 0, maximum: 5, nullable: true, description: "Рейтинг исполнителя (только для роли contractor)" }
        completedTickets: { type: integer, minimum: 0, nullable: true, description: "Количество выполненных заявок (только для роли contractor)" }
        activeTickets: { type: integer, minimum: 0, nullable: true, description: "Количество активных заявок (только для роли contractor)" }
        companyId: { type: string, format: uuid, nullable: true, description: "ID компании (для заказчиков и исполнителей)" }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InternalUserData:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        passwordHash: { type: string }
        role: { type: string }
        status: { type: string }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }

    UsersListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            pages: { type: integer }

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }